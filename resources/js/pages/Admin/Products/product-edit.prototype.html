/* ===== Design-Tokens: wörtlich aus resources/app.css ===== */
:root {
  --font-sans: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
  --background: hsl(0 0% 100%);
  --foreground: hsl(0 0% 3.9%);
  --card: hsl(0 0% 100%);
  --card-foreground: hsl(0 0% 3.9%);
  --popover: hsl(0 0% 100%);
  --popover-foreground: hsl(0 0% 3.9%);
  --primary: hsl(220 68% 16%);
  --primary-foreground: hsl(0 0% 98%);
  --secondary: hsl(0 0% 92.1%);
  --secondary-foreground: hsl(0 0% 9%);
  --muted: hsl(0 0% 96.1%);
  --muted-foreground: hsl(0 0% 45.1%);
  --accent: hsl(0 0% 96.1%);
  --accent-foreground: hsl(0 0% 9%);
  --brand-accent: #35a8e0;
  --brand-secondary: hsl(211 56% 23%);
  --destructive: hsl(0 84.2% 60.2%);
  --destructive-foreground: hsl(0 0% 98%);
  --border: hsl(0 0% 92.8%);
  --input: hsl(0 0% 89.8%);
  --ring: hsl(220 68% 16%);
  --chart-1: hsl(12 76% 61%);
  --chart-2: hsl(173 58% 39%);
  --chart-3: hsl(197 37% 24%);
  --chart-4: hsl(43 74% 66%);
  --chart-5: hsl(27 87% 67%);
  --radius: 0.5rem;
  --sidebar-background: hsl(0 0% 98%);
  --sidebar-foreground: hsl(240 5.3% 26.1%);
  --sidebar-primary: hsl(0 0% 10%);
  --sidebar-primary-foreground: hsl(0 0% 98%);
  --sidebar-accent: hsl(0 0% 94%);
  --sidebar-accent-foreground: hsl(0 0% 30%);
  --sidebar-border: hsl(0 0% 91%);
  --sidebar-ring: hsl(217.2 91.2% 59.8%);
  --sidebar: hsl(0 0% 98%);
  --radius-lg: var(--radius);
  --radius-md: calc(var(--radius) - 2px);
  --radius-sm: calc(var(--radius) - 4px);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
  --shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
}
.dark {
  --background: hsl(0 0% 3.9%);
  --foreground: hsl(0 0% 98%);
  --card: hsl(0 0% 3.9%);
  --card-foreground: hsl(0 0% 98%);
  --popover: hsl(0 0% 3.9%);
  --popover-foreground: hsl(0 0% 98%);
  --primary: hsl(0 0% 98%);
  --primary-foreground: hsl(0 0% 9%);
  --secondary: hsl(0 0% 14.9%);
  --secondary-foreground: hsl(0 0% 98%);
  --muted: hsl(0 0% 16.08%);
  --muted-foreground: hsl(0 0% 63.9%);
  --accent: hsl(0 0% 14.9%);
  --accent-foreground: hsl(0 0% 98%);
  --destructive: hsl(0 84% 60%);
  --destructive-foreground: hsl(0 0% 98%);
  --border: hsl(0 0% 14.9%);
  --input: hsl(0 0% 14.9%);
  --ring: hsl(0 0% 83.1%);
  --chart-1: hsl(220 70% 50%);
  --chart-2: hsl(160 60% 45%);
  --chart-3: hsl(30 80% 55%);
  --chart-4: hsl(280 65% 60%);
  --chart-5: hsl(340 75% 55%);
  --sidebar-background: hsl(0 0% 7%);
  --sidebar-foreground: hsl(0 0% 95.9%);
  --sidebar-primary: hsl(360, 100%, 100%);
  --sidebar-primary-foreground: hsl(0 0% 100%);
  --sidebar-accent: hsl(0 0% 15.9%);
  --sidebar-accent-foreground: hsl(240 4.8% 95.9%);
  --sidebar-border: hsl(0 0% 15.9%);
  --sidebar-ring: hsl(217.2 91.2% 59.8%);
  --sidebar: hsl(240 5.9% 10%);
}

/* ===== Reset (Tailwind preflight, gekürzt) ===== */
*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid var(--border); outline-color: color-mix(in oklab, var(--ring) 50%, transparent); }
html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font-sans); background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-size: 1rem; }
button, input, select, textarea { font: inherit; color: inherit; background: transparent; letter-spacing: inherit; }
button { cursor: pointer; text-align: inherit; }
img, svg { display: block; max-width: 100%; }
h1, h2, h3, h4 { font-size: inherit; font-weight: inherit; }
ul, ol { list-style: none; }
table { border-collapse: collapse; width: 100%; }
.i { width: 1rem; height: 1rem; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: .875rem; height: .875rem; }
.i-lg { width: 1.25rem; height: 1.25rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

/* ===== Utilities ===== */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.g1 { gap: .25rem; } .g2 { gap: .5rem; } .g3 { gap: .75rem; } .g4 { gap: 1rem; } .g6 { gap: 1.5rem; } .g8 { gap: 2rem; }
.between { justify-content: space-between; }
.grow { flex: 1 1 0%; min-width: 0; }
.mla { margin-left: auto; }
.muted { color: var(--muted-foreground); }
.xs { font-size: .75rem; line-height: 1rem; } .sm { font-size: .875rem; line-height: 1.25rem; } .base { font-size: 1rem; line-height: 1.5rem; }
.lg { font-size: 1.125rem; line-height: 1.75rem; } .xl { font-size: 1.25rem; line-height: 1.75rem; } .x2 { font-size: 1.5rem; line-height: 2rem; }
.fw5 { font-weight: 500; } .fw6 { font-weight: 600; }
.tnum { font-variant-numeric: tabular-nums; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.err { font-size: .875rem; color: var(--destructive); }
.pre { white-space: pre-line; }

/* ===== shadcn: Button ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: var(--radius-md); font-size: .875rem; line-height: 1.25rem; font-weight: 500; white-space: nowrap; transition: background-color .15s, color .15s; height: 2.25rem; padding: .5rem 1rem; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }
.btn:disabled { pointer-events: none; opacity: .5; }
.btn-default { background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow); }
.btn-default:hover { background: color-mix(in oklab, var(--primary) 90%, transparent); }
.btn-outline { border: 1px solid var(--input); background: var(--background); }
.btn-outline:hover, .btn-ghost:hover { background: var(--accent); color: var(--accent-foreground); }
.btn-secondary { background: var(--secondary); color: var(--secondary-foreground); box-shadow: var(--shadow-xs); }
.btn-destructive { background: var(--destructive); color: var(--destructive-foreground); box-shadow: var(--shadow); }
.btn-sm { height: 2rem; padding: 0 .75rem; font-size: .75rem; line-height: 1rem; }
.btn-lg { height: 2.5rem; padding: 0 2rem; }
.btn-icon { width: 2.25rem; padding: 0; }
.btn-icon-sm { width: 2rem; height: 2rem; padding: 0; }
.icon-btn { display: inline-flex; border-radius: .25rem; padding: .375rem; color: var(--muted-foreground); }
.icon-btn:hover { background: color-mix(in oklab, var(--destructive) 10%, transparent); color: var(--destructive); }

/* ===== shadcn: Input / Select / Textarea / Label ===== */
.label { font-size: .875rem; line-height: 1; font-weight: 500; display: flex; align-items: center; gap: .5rem; }
.hint { display: block; font-size: .75rem; line-height: 1rem; color: var(--muted-foreground); }
.input, .select, .textarea { display: flex; width: 100%; height: 2.25rem; border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--background); padding: .25rem .75rem; font-size: .875rem; line-height: 1.25rem; box-shadow: var(--shadow-sm); transition: color .15s, box-shadow .15s; }
.input::placeholder, .textarea::placeholder { color: var(--muted-foreground); }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: none; border-color: color-mix(in oklab, var(--ring) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in oklab, var(--ring) 30%, transparent); }
.dark .input, .dark .select { background-color: color-mix(in oklab, var(--input) 30%, transparent); }
.select { appearance: none; padding-right: 2rem; box-shadow: var(--shadow-xs); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right .6rem center; background-color: transparent; }
.select.ph { color: var(--muted-foreground); }
.select option { color: var(--foreground); background: var(--popover); }
.textarea { height: auto; min-height: 4rem; padding: .5rem .75rem; resize: vertical; }
.input.num { font-variant-numeric: tabular-nums; }
.input-affix { position: relative; }
.input-affix .input { padding-right: 2rem; }
.input-affix span { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); font-size: .875rem; color: var(--muted-foreground); pointer-events: none; }
.field { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }

/* ===== shadcn: Checkbox / Switch ===== */
.checkbox { appearance: none; width: 1rem; height: 1rem; flex-shrink: 0; border: 1px solid var(--input); border-radius: 4px; box-shadow: var(--shadow-xs); background: var(--background); cursor: pointer; display: inline-grid; place-content: center; }
.checkbox:checked { background: var(--primary); border-color: var(--primary); }
.checkbox:checked::after { content: ''; width: .75rem; height: .75rem; background: var(--primary-foreground); -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/contain no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/contain no-repeat; }
.checkbox:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent); }
.switch { position: relative; display: inline-flex; width: 2.75rem; height: 1.5rem; flex-shrink: 0; border: 2px solid transparent; border-radius: 9999px; background: var(--input); transition: background-color .15s; cursor: pointer; }
.switch[aria-checked="true"] { background: var(--primary); }
.switch::after { content: ''; width: 1.25rem; height: 1.25rem; border-radius: 9999px; background: #fff; box-shadow: var(--shadow-lg); transition: transform .15s; }
.dark .switch[aria-checked="true"]::after { background: var(--primary-foreground); }
.switch[aria-checked="true"]::after { transform: translateX(1.25rem); }
.switch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }

/* ===== shadcn: Card / Badge / Separator / Tabs / Table ===== */
.card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: .75rem; box-shadow: var(--shadow-sm); }

.card-c { padding: 1.25rem 1.5rem; }
.card-f { padding: 0 1.5rem 1.25rem; display: flex; align-items: center; }
.box { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
.box-dash { border: 1px dashed var(--input); border-radius: var(--radius-lg); color: var(--muted-foreground); font-size: .875rem; display: flex; align-items: center; justify-content: center; min-height: 5rem; }
.badge { display: inline-flex; align-items: center; gap: .25rem; border-radius: 9999px; padding: .125rem .5rem; font-size: .75rem; line-height: 1rem; font-weight: 500; white-space: nowrap; }
.badge-primary { background: color-mix(in oklab, var(--primary) 10%, transparent); color: var(--primary); }
.badge-solid { background: var(--primary); color: var(--primary-foreground); border-radius: .25rem; }
.badge-muted { background: var(--muted); }
.badge-outline { border: 1px solid var(--border); }
.badge-ok { background: color-mix(in oklab, var(--chart-2) 14%, transparent); color: var(--chart-2); }
.badge-off { background: color-mix(in oklab, var(--destructive) 12%, transparent); color: var(--destructive); }
.sep { height: 1px; background: var(--border); width: 100%; flex-shrink: 0; }
.tabs-list { display: inline-flex; height: 2.25rem; align-items: center; justify-content: center; border-radius: .5rem; background: var(--muted); padding: 3px; color: var(--muted-foreground); }
.tab { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; white-space: nowrap; height: calc(100% - 1px); border-radius: var(--radius-md); border: 1px solid transparent; padding: .125rem .75rem; font-size: .875rem; font-weight: 500; color: color-mix(in oklab, var(--foreground) 60%, transparent); transition: all .15s; }
.dark .tab { color: var(--muted-foreground); }
.tab:hover { color: var(--foreground); }
.tab[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
.dark .tab[aria-selected="true"] { background: color-mix(in oklab, var(--input) 30%, transparent); border-color: var(--input); }
.tab .count { border-radius: 9999px; background: var(--muted); padding: .125rem .375rem; font-size: .75rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .count { background: var(--muted); }
.tbl th { text-align: left; font-size: .75rem; font-weight: 500; color: var(--muted-foreground); padding: .5rem .75rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: .375rem .75rem; border-bottom: 1px solid var(--border); font-size: .875rem; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: color-mix(in oklab, var(--muted) 50%, transparent); }
.divide > * + * { border-top: 1px solid var(--border); }
.ghost-in { height: 2rem; border: 1px solid transparent; box-shadow: none; background: transparent; padding: 0 .5rem; margin: 0 -.5rem; width: calc(100% + 1rem); }
.ghost-in:hover { background: var(--muted); }
.ghost-in:focus-visible { background: var(--background); border-color: color-mix(in oklab, var(--ring) 60%, transparent); }

/* ===== App-Shell: SidebarProvider (inset) ===== */
.shell { display: flex; min-height: 100svh; width: 100%; background: var(--sidebar); }
.sidebar-gap { width: 15rem; flex-shrink: 0; }
.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; width: 15rem; height: 100svh; padding: .5rem; color: var(--sidebar-foreground); }
.sidebar-in { display: flex; flex-direction: column; height: 100%; background: var(--sidebar); gap: .5rem; }
.sb-head { padding: .5rem; }
.sb-btn { display: flex; align-items: center; gap: .5rem; width: 100%; height: 2rem; border-radius: var(--radius-md); padding: .5rem; font-size: .875rem; text-align: left; color: inherit; text-decoration: none; transition: background-color .15s; }
.sb-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.sb-btn[data-active="true"] { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); font-weight: 500; }
.sb-btn.lg { height: 3rem; }
.sb-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
.sb-group { padding: 0 .5rem; }
.sb-label { height: 2rem; display: flex; align-items: center; padding: 0 .5rem; font-size: .75rem; font-weight: 500; color: color-mix(in oklab, var(--sidebar-foreground) 70%, transparent); }
.sb-menu { display: flex; flex-direction: column; gap: .25rem; }
.sb-foot { padding: .5rem; }
.inset { flex: 1; min-width: 0; margin: .5rem .5rem .5rem 0; height: calc(100svh - 1rem); display: flex; flex-direction: column; overflow: hidden; border-radius: .75rem; background: var(--background); box-shadow: var(--shadow-sm); position: relative; }
.app-head { display: flex; height: 4rem; flex-shrink: 0; align-items: center; gap: .5rem; border-bottom: 1px solid color-mix(in oklab, var(--sidebar-border) 70%, transparent); padding: 0 1rem; }
.sb-trigger { display: none; margin-left: -.25rem; }
.crumbs { display: flex; align-items: center; gap: .375rem; font-size: .875rem; color: var(--muted-foreground); }
.crumbs a { color: inherit; text-decoration: none; transition: color .15s; } .crumbs a:hover { color: var(--foreground); }
.crumbs .cur { font-size: 1rem; font-weight: 600; color: var(--foreground); }
.scroller { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
.page { padding: 1rem; display: flex; flex-direction: column; gap: 1.5rem; flex: 1; }
.backdrop { display: none; }
@media (max-width: 767px) {
  .sidebar-gap { display: none; }
  .sidebar { transform: translateX(-100%); transition: transform .2s; background: var(--sidebar); border-right: 1px solid var(--sidebar-border); }
  .sidebar.open { transform: none; }
  .backdrop.open { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .5); z-index: 25; }
  .inset { margin: 0; border-radius: 0; height: 100svh; }
  .sb-trigger { display: inline-flex; }
}

/* Dropdown (RowActions) */
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + .25rem); z-index: 40; min-width: 12rem; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--popover); color: var(--popover-foreground); padding: .25rem; box-shadow: var(--shadow-lg); display: none; }

.menu button:hover { background: var(--accent); }
.menu .danger { color: var(--destructive); }

/* ===== Prototyp-Umschalter (nicht Teil des Designs) ===== */
.switcher { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: .25rem; padding: .375rem; border-radius: 9999px; background: #111; color: #fff; box-shadow: 0 10px 30px rgb(0 0 0 / .35); font-size: .8125rem; max-width: calc(100vw - 1rem); }
.dark .switcher { background: #fafafa; color: #111; }
.switcher button { display: inline-flex; align-items: center; justify-content: center; height: 2rem; min-width: 2rem; border-radius: 9999px; color: inherit; padding: 0 .5rem; }

.switcher .lbl { padding: 0 .5rem; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.switcher .lbl b { font-weight: 600; margin-right: .375rem; }
.switcher .chips { display: flex; gap: 2px; border-left: 1px solid rgb(128 128 128 / .4); border-right: 1px solid rgb(128 128 128 / .4); padding: 0 .25rem; margin: 0 .25rem; }
.switcher .chips button { min-width: 1.75rem; height: 1.75rem; padding: 0; font-weight: 600; }
.switcher .chips button[aria-current="true"] { background: var(--brand-accent); color: #fff; }
.switcher .i { stroke-width: 2.25; }
@media (max-width: 760px) { .switcher .chips { display: none; } }

.toast { position: fixed; right: 1.25rem; top: 1.25rem; z-index: 120; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: .75rem 1rem; font-size: .875rem; display: none; align-items: center; gap: .5rem; }
.toast.show { display: flex; }

/* ===== Gemeinsame Produktbausteine ===== */
.pimg { position: relative; overflow: hidden; border-radius: var(--radius-lg); border: 1px solid var(--input); background: var(--muted); transition: opacity .15s, box-shadow .15s; }
.pimg img { width: 100%; aspect-ratio: 1; object-fit: cover; }

.pimg:hover .tools { opacity: 1; }

.pimg .del { right: .25rem; top: .25rem; border-radius: .25rem; background: rgb(0 0 0 / .5); color: #fff; padding: .25rem; display: inline-flex; }
.pimg .del:hover { background: var(--destructive); }
.pimg .mainbtn { right: .25rem; bottom: .25rem; border-radius: .25rem; background: rgb(0 0 0 / .5); color: #fff; padding: .125rem .375rem; font-size: .75rem; }
.pimg .mainbadge { position: absolute; left: .25rem; bottom: .25rem; display: flex; align-items: center; gap: .25rem; border-radius: .25rem; background: var(--primary); color: var(--primary-foreground); padding: .125rem .375rem; font-size: .75rem; font-weight: 500; }

.upload { display: inline-flex; cursor: pointer; align-items: center; gap: .5rem; border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--background); padding: .5rem .75rem; font-size: .875rem; font-weight: 500; box-shadow: var(--shadow-sm); }
.upload:hover { background: var(--accent); }
.upload[aria-disabled="true"] { pointer-events: none; opacity: .5; }
.grid-img { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; }
.stars { display: inline-flex; gap: 1px; color: var(--chart-4); }
.stars .off { color: var(--input); }
.vrow { display: flex; align-items: center; gap: .75rem; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); padding: .625rem 1rem; }
.vedit { display: flex; align-items: center; gap: .5rem; border: 1px solid var(--primary); border-radius: var(--radius-lg); background: color-mix(in oklab, var(--muted) 40%, transparent); padding: .75rem; }
.vnew { display: flex; align-items: center; gap: .5rem; border: 1px solid var(--border); border-radius: var(--radius-lg); background: color-mix(in oklab, var(--muted) 40%, transparent); padding: .75rem; }
.chk { display: inline-flex; align-items: center; gap: .375rem; font-size: .875rem; color: var(--muted-foreground); cursor: pointer; user-select: none; }
.spec-row { display: flex; align-items: center; gap: .5rem; }
.spec-row .a { width: 40%; } .spec-row .b { flex: 1; }
.avail { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); padding: 1rem; }
.sp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
.sp-grid label { display: flex; align-items: center; gap: .5rem; font-size: .875rem; cursor: pointer; }
.pill-check { display: inline-flex; align-items: center; gap: .375rem; border: 1px solid var(--input); border-radius: 9999px; padding: .25rem .75rem; font-size: .875rem; cursor: pointer; transition: all .15s; }
.pill-check[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.stat { font-variant-numeric: tabular-nums; }
.progress { height: .5rem; border-radius: 9999px; background: color-mix(in oklab, var(--primary) 20%, transparent); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--primary); transition: width .3s; }
.ok { color: var(--chart-2); } .warn { color: var(--chart-5); }

/* ===== Varianten-spezifisch ===== */
/* B */
.b-cols { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 1.5rem; align-items: start; }
.b-side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 1rem; }
@media (max-width: 1100px) { .b-cols { grid-template-columns: 1fr; } .b-side { position: static; } }
/* C */
.c-wrap { display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: 2.5rem; align-items: start; }
.c-nav { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: .125rem; }
.c-nav a { display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius-md); padding: .375rem .625rem; font-size: .875rem; color: var(--muted-foreground); text-decoration: none; }

.c-sec { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 2rem; padding: 2rem 0; border-bottom: 1px solid var(--border); scroll-margin-top: 0; }
.c-sec:first-child { padding-top: .5rem; } .c-sec:last-child { border-bottom: 0; }
@media (max-width: 1000px) { .c-wrap { grid-template-columns: 1fr; } .c-nav { display: none; } .c-sec { grid-template-columns: 1fr; gap: 1rem; } }
/* D */
.d-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2rem; }
.d-main { aspect-ratio: 4/3; border-radius: .75rem; overflow: hidden; border: 1px solid var(--border); background: var(--muted); position: relative; }
.d-main img { width: 100%; height: 100%; object-fit: contain; }
.d-thumbs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .5rem; margin-top: .75rem; }
.d-thumbs .pimg img { aspect-ratio: 1; }
.d-thumbs .slot { aspect-ratio: 1; }
.d-title { font-size: 1.5rem; line-height: 2rem; font-weight: 600; height: 3rem; padding: 0 .5rem; margin: 0 -.5rem; width: calc(100% + 1rem); border: 1px solid transparent; border-radius: var(--radius-md); }
.d-title:hover { background: var(--muted); } .d-title:focus-visible { outline: none; background: var(--background); border-color: color-mix(in oklab, var(--ring) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in oklab, var(--ring) 30%, transparent); }
.d-price { font-size: 1.875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 1000px) { .d-top { grid-template-columns: 1fr; } }
/* E */
.e-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 26rem); gap: 1.5rem; align-items: start; }
.e-prev { position: sticky; top: 0; }
.e-frame { background: var(--muted); border-radius: .75rem; padding: 1rem; border: 1px solid var(--border); }
.shop-card { background: var(--card); border: 1px solid var(--border); border-radius: .75rem; overflow: hidden; box-shadow: var(--shadow-sm); }
.shop-card img { aspect-ratio: 1; width: 100%; object-fit: cover; }

.vchip { border: 1px solid var(--input); border-radius: var(--radius-md); padding: .25rem .625rem; font-size: .8125rem; background: var(--background); }
.vchip.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); font-weight: 500; }
@media (max-width: 1100px) { .e-cols { grid-template-columns: 1fr; } .e-prev { position: static; } }
/* F */
.stepper { display: flex; align-items: center; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; }
.step { display: flex; align-items: center; gap: .5rem; font-size: .875rem; color: var(--muted-foreground); white-space: nowrap; padding: .25rem .5rem .25rem .25rem; border-radius: 9999px; }
.step:hover { background: var(--accent); }
.step .dot { display: inline-flex; width: 1.5rem; height: 1.5rem; align-items: center; justify-content: center; border-radius: 9999px; border: 1px solid var(--input); font-size: .75rem; font-weight: 600; background: var(--background); }
.step.cur { color: var(--foreground); font-weight: 500; }
.step.cur .dot { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.step.done .dot { background: color-mix(in oklab, var(--primary) 10%, transparent); color: var(--primary); border-color: transparent; }
.step-line { height: 1px; width: 1.5rem; background: var(--border); flex-shrink: 0; }
.f-foot { position: sticky; bottom: 0; margin-top: auto; display: flex; align-items: center; gap: .75rem; border-top: 1px solid var(--border); background: color-mix(in oklab, var(--background) 92%, transparent); backdrop-filter: blur(6px); padding: .75rem 1rem; }
.f-body { width: 100%; max-width: 40rem; margin: 0 auto; }
/* G */
.acc { border: 1px solid var(--border); border-radius: .75rem; overflow: hidden; background: var(--card); }
.acc-item + .acc-item { border-top: 1px solid var(--border); }
.acc-h { display: flex; width: 100%; align-items: center; gap: .75rem; padding: .875rem 1rem; text-align: left; }
.acc-h:hover { background: color-mix(in oklab, var(--muted) 50%, transparent); }
.acc-h .chev { transition: transform .15s; color: var(--muted-foreground); }
.acc-item.open .chev { transform: rotate(180deg); }
.acc-b { display: none; padding: .25rem 1rem 1.25rem 3.25rem; }
.acc-item.open .acc-b { display: block; }
.acc-ic { display: inline-flex; width: 1.5rem; height: 1.5rem; align-items: center; justify-content: center; flex-shrink: 0; }
/* H */
.h-strip { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.h-thumbs { display: flex; gap: .5rem; overflow-x: auto; }
.h-thumbs .pimg { width: 5rem; flex-shrink: 0; }
.h-thumbs .mainbadge { font-size: 0; gap: 0; padding: .125rem .25rem; }
.kv { display: grid; grid-template-columns: 13rem minmax(0, 1fr); align-items: center; gap: 1rem; padding: .375rem 1rem; min-height: 2.75rem; }

@media (max-width: 760px) { .kv { grid-template-columns: 1fr; gap: .25rem; } .grid-img { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

<body>
<div class="shell" id="shell">
  <div class="sidebar-gap"></div>

function stars(n, cls=''){ return `<span class="stars ${cls}" aria-label="${n} von 5 Sternen">${[1,2,3,4,5].map(i=>`<svg class="i i-sm" style="fill:${i<=Math.round(n)?'currentColor':'none'}${i<=Math.round(n)?'':';color:var(--input)'}"><use href="#i-star"/></svg>`).join('')}</span>`; }
function toast(t){ $('#toasttxt').textContent = t; const el = $('#toast'); el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'), 2200); }

/* ================= Vollständigkeit ================= */
function checks(){
  const filled = S.specs.filter(s => s.label.trim() && s.value.trim()).length;
  return [
    {key:'basis', label:'Name und Preis', ok: !!S.name.trim() && parseFloat(S.price) > 0},
    {key:'zuordnung', label:'Kategorie, Hersteller' + (hasSpec() ? ', Fachrichtung' : ''), ok: !!S.category && !!S.manufacturer && (!hasSpec() || S.specialties.length > 0)},
    {key:'beschr', label:'Beschreibung (mind. 80 Zeichen)', ok: S.description.trim().length >= 80},
    {key:'specs', label:'Technische Daten', ok: filled > 0},
    {key:'images', label:'Mindestens ein Bild', ok: S.images.length > 0},
    {key:'variants', label:'Variationen (optional)', ok: S.variants.length === 0 || S.variants.some(v=>v.def), opt:true}
  ];
}
const statusIcon = ok => ok ? `<span class="ok">${ic('circle-check','i-lg')}</span>` : `<span class="warn">${ic('circle-alert','i-lg')}</span>`;

/* ================= Gemeinsame Feld-Bausteine ================= */
const fName = (o={}) => `<div class="field"><label class="label" for="f-name">Name</label><input id="f-name" class="input" data-bind="name" value="${esc(S.name)}" placeholder="Produktname"></div>`;
const fPrice = () => `<div class="field"><label class="label" for="f-price">Preis (€)</label><input id="f-price" class="input num" type="number" step="0.01" min="0" data-bind="price" value="${esc(S.price)}" placeholder="0.00"></div>`;
const fCategory = () => `<div class="field"><label class="label" for="f-cat">Kategorie</label><select id="f-cat" class="select ${S.category?'':'ph'}" data-select="category">${S.category?'':'<option value="">Kategorie wählen</option>'}${CATEGORIES.map(c=>`<option value="${c.slug}" ${c.slug===S.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;
const fManufacturer = () => `<div class="field"><label class="label" for="f-man">Hersteller</label><select id="f-man" class="select ${S.manufacturer?'':'ph'}" data-select="manufacturer">${S.manufacturer?'':'<option value="">Hersteller wählen</option>'}${MANUFACTURERS.map(m=>`<option value="${m.id}" ${m.id===S.manufacturer?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`;
const fSpecialties = (style='grid') => !hasSpec() ? '' : `<fieldset class="col g2"><legend style="margin-bottom:.5rem"><span class="label">Fachrichtungen</span><span class="hint">Mehrfachauswahl. Grundlage für den Fachrichtungs-Filter im Shop.</span></legend>
  ${style==='pills' ? `<div class="row wrap g2">${SPECIALTIES.map(s=>`<button type="button" class="pill-check" aria-pressed="${S.specialties.includes(s.slug)}" data-act="spec-toggle" data-v="${s.slug}">${S.specialties.includes(s.slug)?ic('check','i-sm'):''}${esc(s.name)}</button>`).join('')}</div>`
  : `<div class="sp-grid">${SPECIALTIES.map(s=>`<label><input type="checkbox" class="checkbox" data-spec="${s.slug}" ${S.specialties.includes(s.slug)?'checked':''}>${esc(s.name)}</label>`).join('')}</div>`}</fieldset>`;
const fDesc = (rows=8) => `<div class="field"><label class="label" for="f-desc">Beschreibung</label><textarea id="f-desc" class="textarea" rows="${rows}" data-bind="description" placeholder="Produktbeschreibung…">${esc(S.description)}</textarea><span class="hint"><span data-live="chars">${S.description.length}</span> Zeichen</span></div>`;
const fAvail = () => `<div class="avail"><div><p class="sm fw5">Verfügbarkeit</p><p class="xs muted">Produkt ist im Shop bestellbar</p></div><button type="button" class="switch" role="switch" aria-label="Verfügbarkeit umschalten" aria-checked="${S.available}" data-act="avail"></button></div>`;
function fSpecs(compact=false){
  return `<div class="col g2"><div><span class="label">Technische Daten</span><p class="hint" style="margin-top:.25rem">Erscheint im Shop im Reiter „Technische Daten“. Leere Zeilen werden beim Speichern ignoriert.</p></div>
  ${S.specs.map((s,i)=>`<div class="spec-row"><input class="input a" data-bind="specs.${i}.label" value="${esc(s.label)}" placeholder="Bezeichnung (z.B. Gewicht)" aria-label="Bezeichnung"><input class="input b" data-bind="specs.${i}.value" value="${esc(s.value)}" placeholder="Wert (z.B. 2,4 kg)" aria-label="Wert"><button type="button" class="icon-btn" aria-label="Zeile entfernen" data-act="spec-del" data-i="${i}">${ic('trash-2')}</button></div>`).join('')}
  <div><button type="button" class="btn btn-outline btn-sm" data-act="spec-add">${ic('plus')}Eigenschaft hinzufügen</button></div></div>`;
}
function imgTile(img, idx, opts={}){
  return `<div class="pimg ${UI.drag===img.id?'drag':''} ${UI.over===img.id&&UI.drag!==img.id?'over':''}" draggable="true" data-img="${img.id}" role="listitem">
    <img src="${imgSrc(img.tone)}" alt="" draggable="false">
    <div class="tools grip">${ic('grip-vertical')}</div>
    <button type="button" class="tools del" aria-label="Bild löschen" data-act="img-del" data-id="${img.id}">${ic('trash-2')}</button>
    ${idx===0 ? `<div class="mainbadge">${ic('star','i-sm')}Hauptbild</div>` : (opts.mainBtn ? `<button type="button" class="tools mainbtn" data-act="img-main" data-id="${img.id}">Als Hauptbild</button>` : '')}
  </div>`;
}
const uploadBtn = () => `<button type="button" class="upload" data-act="img-add" aria-disabled="${S.images.length>=MAX_IMAGES}">${ic('image-plus')}Bild hinzufügen</button>`;
function fImages(cols=3){
  return `<div class="col g4"><div class="row between"><div><h2 class="base fw6">Produktbilder</h2><p class="sm muted">${S.images.length}/${MAX_IMAGES} Bilder · Reihenfolge per Drag &amp; Drop ändern</p></div>${uploadBtn()}</div>
  ${S.images.length===0 ? '<div class="box-dash" style="height:8rem">Noch keine Bilder hochgeladen</div>' : `<div role="list" class="grid-img" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${S.images.map((im,i)=>imgTile(im,i,{mainBtn:true})).join('')}</div>`}</div>`;
}
function variantsBlock(mode='list'){
  const nv = UI.newVariant;
  const newRow = `<div class="vnew"><input class="input grow" data-nv="label" value="${esc(nv.label)}" placeholder="Label (z.B. 8er-Pack)"><input class="input" style="width:7rem" type="number" step="0.01" min="0" data-nv="price" value="${esc(nv.price)}" placeholder="Preis"><label class="chk"><input type="checkbox" class="checkbox" data-nv="def" ${nv.def?'checked':''}>Standard</label><button type="button" class="btn btn-outline btn-sm" data-act="var-add" ${nv.label&&nv.price?'':'disabled'}>${ic('plus')}Hinzufügen</button></div>`;
  let list;
  if (!S.variants.length) list = '<div class="box-dash">Noch keine Variationen angelegt</div>';
  else if (mode === 'inline') list = `<div class="box"><table class="tbl"><thead><tr><th>Label</th><th style="width:8rem">Preis (€)</th><th style="width:6rem">Standard</th><th style="width:3rem"></th></tr></thead><tbody>${S.variants.map((v,i)=>`<tr><td><input class="input ghost-in" data-bind="variants.${i}.label" value="${esc(v.label)}" aria-label="Label"></td><td><input class="input ghost-in num" type="number" step="0.01" data-bind="variants.${i}.price" value="${esc(v.price)}" aria-label="Preis"></td><td><button type="button" class="pill-check" style="padding:.125rem .5rem" aria-pressed="${v.def}" data-act="var-def" data-id="${v.id}">${v.def?ic('check','i-sm')+'Standard':'setzen'}</button></td><td><button type="button" class="icon-btn" aria-label="Löschen" data-act="var-del" data-id="${v.id}">${ic('trash-2')}</button></td></tr>`).join('')}</tbody></table></div>`;
  else list = `<div class="col g2">${S.variants.map(v => UI.editVariant===v.id
    ? `<div class="vedit"><input class="input grow" data-bind="variants.${S.variants.indexOf(v)}.label" value="${esc(v.label)}" placeholder="Label"><input class="input" style="width:7rem" type="number" step="0.01" data-bind="variants.${S.variants.indexOf(v)}.price" value="${esc(v.price)}"><label class="chk"><input type="checkbox" class="checkbox" data-vdef="${v.id}" ${v.def?'checked':''}>Standard</label><button type="button" class="btn btn-default btn-sm" data-act="var-save">Speichern</button><button type="button" class="btn btn-ghost btn-sm" data-act="var-save">Abbrechen</button></div>`
    : `<div class="vrow"><span class="grow sm fw5">${esc(v.label)}</span>${v.def?`<span class="badge badge-primary">${ic('check','i-sm')}Standard</span>`:''}<span class="sm muted tnum" style="width:5rem;text-align:right">${fmt(v.price)}</span><button type="button" class="btn btn-ghost btn-sm" data-act="var-edit" data-id="${v.id}">Bearbeiten</button><button type="button" class="icon-btn" aria-label="Löschen" data-act="var-del" data-id="${v.id}">${ic('trash-2')}</button></div>`).join('')}</div>`;
  return `<div class="col g4"><div><h2 class="base fw6">Variationen</h2><p class="sm muted">Optionale Preisvarianten — z.B. Packungsgrößen. Ohne Variationen gilt der Produktpreis.</p></div>${list}${newRow}</div>`;
}
function ratingsBlock(){
  return `<div class="col g4"><div><h2 class="base fw6">Bewertungen</h2><p class="sm muted">Bewertungen von Käufern sind sofort öffentlich. Hier lassen sich unpassende löschen.</p></div>
  ${S.ratings.length ? `<div class="box divide">${S.ratings.map(r=>`<div class="row g4" style="align-items:flex-start;justify-content:space-between;padding:1rem"><div class="col g1" style="min-width:0"><p class="sm"><span class="fw5">${r.stars} von 5 Sternen</span><span class="muted"> · ${r.date} · ${r.verified?'Verifizierter Kauf':'ohne Kaufbezug (Altbestand)'}</span></p><p class="sm muted pre">${esc(r.content)}</p></div><button type="button" class="btn btn-outline btn-sm" style="color:var(--destructive);flex-shrink:0" data-act="rat-del" data-id="${r.id}">Löschen</button></div>`).join('')}</div>` : '<p class="sm muted">Noch keine Bewertungen.</p>'}</div>`;
}
const formButtons = () => `<div class="row g3"><button type="submit" class="btn btn-default" data-act="save">Speichern</button><button type="button" class="btn btn-outline" data-act="noop">Abbrechen</button></div>`;
const countBadge = n => n > 0 ? `<span class="count">${n}</span>` : '';
const sectionHead = (title, desc) => `<div><h2 class="base fw6">${title}</h2>${desc?`<p class="sm muted" style="margin-top:.25rem">${desc}</p>`:''}</div>`;

/* ================= Varianten ================= */
const VARIANTS = {};

/* A — Reiter (Ist-Zustand) */
VARIANTS.A = {name:'Reiter (Ist-Zustand)', render(){

}};

/* B — Eine Seite, zwei Spalten */
VARIANTS.B = {name:'Eine Seite · zwei Spalten', render(){
  const card = (title, desc, inner, extra='') => `<section class="card"><div class="card-h"><div class="row between"><h2 class="card-t">${title}</h2>${extra}</div>${desc?`<p class="card-d">${desc}</p>`:''}</div><div class="card-c">${inner}</div></section>`;
  const main = S.images[0];
  return `<div class="b-cols" style="max-width:76rem;width:100%;margin:0 auto">
  <div class="col g6">
    ${card('Allgemein','Name und Beschreibung, wie sie im Shop erscheinen.', `<div class="col g6">${fName()}${fDesc(7)}</div>`)}
    ${card('Technische Daten','Erscheint im Shop im Reiter „Technische Daten“.', fSpecs().replace(/<div><span class="label">Technische Daten<\/span>.*?<\/div>/s,''))}
    ${card('Variationen','Optionale Preisvarianten, z.B. Packungsgrößen.', variantsBlock('inline').replace(/<div><h2 class="base fw6">Variationen<\/h2>.*?<\/p><\/div>/s,''), `<span class="badge badge-muted">${S.variants.length}</span>`)}
    ${card('Bewertungen','Von Käufern, sofort öffentlich.', ratingsBlock().replace(/<div><h2 class="base fw6">Bewertungen<\/h2>.*?<\/p><\/div>/s,''), `<span class="row g1 sm">${stars(avgStars())}<span class="muted">${avgStars().toFixed(1).replace('.',',')}</span></span>`)}
  </div>
  <aside class="b-side">

    ${card('Preis &amp; Zuordnung','', `<div class="col g4">${fPrice()}${fCategory()}${fManufacturer()}${fSpecialties()}</div>`)}
    <section class="card"><div class="card-h"><div class="row between"><h2 class="card-t">Bilder</h2><span class="xs muted">${S.images.length}/${MAX_IMAGES}</span></div></div><div class="card-c col g3">
      ${main?`<div class="pimg" style="border-radius:var(--radius-lg)"><img src="${imgSrc(main.tone)}" alt=""><div class="mainbadge">${ic('star','i-sm')}Hauptbild</div></div>`:'<div class="box-dash" style="height:10rem">Kein Bild</div>'}
      <div role="list" class="grid-img" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem">${S.images.slice(1).map((im,i)=>imgTile(im,i+1,{mainBtn:true})).join('')}</div>
      ${uploadBtn().replace('class="upload"','class="upload" style="justify-content:center;width:100%"')}
    </div></section>
  </aside></div>`;
}};

/* C — Abschnitts-Navigation (Settings-Stil) */
const C_SECTIONS = [['c-basis','Allgemein'],['c-preis','Preis & Zuordnung'],['c-spec','Technische Daten'],['c-bilder','Bilder'],['c-var','Variationen'],['c-rat','Bewertungen'],['c-status','Verfügbarkeit']];
VARIANTS.C = {name:'Abschnitts-Navigation', render(){
  const sec = (id, title, desc, inner) => `<section class="c-sec" id="${id}"><div><h2 class="base fw6">${title}</h2><p class="sm muted" style="margin-top:.25rem">${desc}</p></div><div class="col g6" style="min-width:0">${inner}</div></section>`;

    ${sec('c-preis','Preis &amp; Zuordnung','Grundpreis, Kategorie, Hersteller und Fachrichtungen für die Filter im Shop.', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">${fPrice()}${fManufacturer()}</div>${fCategory()}${fSpecialties()}`)}
    ${sec('c-spec','Technische Daten','Erscheint im Shop im Reiter „Technische Daten“.', fSpecs().replace(/<div><span class="label">Technische Daten<\/span>.*?<\/div>/s,''))}
    ${sec('c-bilder','Bilder',`Bis zu ${MAX_IMAGES} Bilder, das erste ist das Hauptbild.`, fImages(3).replace(/<div><h2 class="base fw6">Produktbilder<\/h2>.*?<\/p><\/div>/s,'<span class="sm muted">'+S.images.length+'/'+MAX_IMAGES+' Bilder</span>'))}
    ${sec('c-var','Variationen','Optionale Preisvarianten, z.B. Packungsgrößen.', variantsBlock('list').replace(/<div><h2 class="base fw6">Variationen<\/h2>.*?<\/p><\/div>/s,''))}
    ${sec('c-rat','Bewertungen','Bewertungen von Käufern sind sofort öffentlich.', ratingsBlock().replace(/<div><h2 class="base fw6">Bewertungen<\/h2>.*?<\/p><\/div>/s,''))}
    ${sec('c-status','Verfügbarkeit','Steuert, ob das Produkt im Shop bestellbar ist.', fAvail())}
    <div class="row g3" style="padding:1.5rem 0 .5rem">${formButtons()}</div>

}, after(){

}};

/* ================= Rendering / Routing ================= */
const KEYS = Object.keys(VARIANTS);
let current = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
if (!VARIANTS[current]) current = 'A';

const NAV = [
  ['Plattform', [['Dashboard','layout-grid'],['Kunden','users'],['Bestellungen','shopping-cart']]],
  ['Katalog', [['Hersteller','building-2'],['Produkte','package',true]]],
  ['Marketing', [['Newsletter','mail'],['Social-Media','share-2'],['Magazin','newspaper']]],
  ['Einstellungen', [['Versandarten','truck']]]
];
$('#sbnav').innerHTML = NAV.map(([t,items]) => `<div class="sb-group"><div class="sb-label">${t}</div><ul class="sb-menu">${items.map(([l,i,a])=>`<li><a class="sb-btn" href="#" data-active="${!!a}" data-act="noop">${ic(i)}<span class="truncate">${l}</span></a></li>`).join('')}</ul></div>`).join('');

function render(){
  const sc = $('#scroller'); const top = sc.scrollTop;
  sc.onscroll = null;
  $('#content').innerHTML = VARIANTS[current].render();
  sc.scrollTop = top;
  VARIANTS[current].after && VARIANTS[current].after();
  $('#crumbname').textContent = S.name || 'Neues Produkt';
  document.title = 'PROTOTYP ' + current + ' – ' + (S.name || 'Produkt');
  renderSwitcher();
}
function renderSwitcher(){
  $('#switcher').innerHTML = `<button data-sw="prev" aria-label="Vorherige Variante">${ic('chevron-left')}</button><span class="lbl"><b>${current}</b>${esc(VARIANTS[current].name)}</span><button data-sw="next" aria-label="Nächste Variante">${ic('chevron-right')}</button><span class="chips">${KEYS.map(k=>`<button data-sw="${k}" aria-current="${k===current}" title="${esc(VARIANTS[k].name)}">${k}</button>`).join('')}</span><button data-sw="theme" aria-label="Hell/Dunkel">${ic(document.documentElement.classList.contains('dark')?'sun':'moon')}</button>`;
}
function setVariant(k){
  current = k; const u = new URL(location.href); u.searchParams.set('variant', k); history.replaceState(null,'',u);
  render();
}
function cycle(d){ setVariant(KEYS[(KEYS.indexOf(current)+d+KEYS.length)%KEYS.length]); }

/* Live-Updates ohne Re-Render (Fokus bleibt erhalten) */
function refreshLive(){
  const c = checks(); const done = c.filter(x=>x.ok).length;
  const setT = (k,v) => $$(`[data-live="${k}"]`).forEach(e=>e.textContent = v);
  setT('chars', S.description.length);
  setT('sum-basis', `${S.name} · ${fmt(S.price)}`);
  setT('sum-zuordnung', `${catName(S.category)||'–'} · ${manName(S.manufacturer)||'–'}`);
  setT('sum-beschr', `${S.description.length} Zeichen`);
  setT('sum-specs', `${S.specs.filter(s=>s.label.trim()&&s.value.trim()).length} Einträge`);
  setT('sum-variants', `${S.variants.length} Variationen`);
  $('#crumbname').textContent = S.name || 'Neues Produkt';
  $$('[data-status]').forEach(e => { const k = e.dataset.status; if (k) e.innerHTML = statusIcon(c.find(x=>x.key===k).ok); });
  $$('[data-progress]').forEach(e => e.style.width = (done/c.length*100)+'%');
  $$('[data-progress-txt]').forEach(e => e.textContent = done+'/'+c.length);
  if ($('#preview')) $('#preview').innerHTML = previewHTML();
  UI.dirty = true;
}

/* ================= Events ================= */
const content = $('#content');
content.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind){ setPath(S, t.dataset.bind, t.value); refreshLive(); }
  else if (t.dataset.nv){ if (t.type==='checkbox') UI.newVariant.def = t.checked; else UI.newVariant[t.dataset.nv] = t.value; const b = $('[data-act="var-add"]'); if (b) b.disabled = !(UI.newVariant.label && UI.newVariant.price); }
});
content.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.select){ S[t.dataset.select] = t.value; if (t.dataset.select==='category' && !hasSpec()) S.specialties = []; refreshLive(); render(); }
  else if (t.dataset.spec){ S.specialties = t.checked ? [...S.specialties, t.dataset.spec] : S.specialties.filter(x=>x!==t.dataset.spec); refreshLive(); }
  else if (t.dataset.vdef){ const id = +t.dataset.vdef; S.variants.forEach(v => v.def = t.checked && v.id===id); refreshLive(); render(); }
});
document.addEventListener('click', e => {
  const sw = e.target.closest('[data-sw]');
  if (sw){ const v = sw.dataset.sw; if (v==='prev') cycle(-1); else if (v==='next') cycle(1); else if (v==='theme'){ document.documentElement.classList.toggle('dark'); renderSwitcher(); } else setVariant(v); return; }
  if (!e.target.closest('.menu-wrap')) $('#menu').classList.remove('open');
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = +a.dataset.id, i = +a.dataset.i, v = a.dataset.v;
  const dirty = () => { UI.dirty = true; };
  switch (act){
    case 'noop': e.preventDefault(); toast('Prototyp: ohne Funktion'); return;
    case 'tab': UI.tab = v; break;
    case 'avail': S.available = !S.available; dirty(); break;
    case 'spec-add': S.specs.push({label:'',value:''}); dirty(); break;
    case 'spec-del': S.specs.splice(i,1); dirty(); break;
    case 'spec-toggle': S.specialties = S.specialties.includes(v) ? S.specialties.filter(x=>x!==v) : [...S.specialties, v]; dirty(); break;
    case 'img-add': if (S.images.length>=MAX_IMAGES) return; S.images.push({id:nextId++, tone:(S.images.length+nextId)%5}); dirty(); break;
    case 'img-del': if (!confirm('Bild wirklich löschen?')) return; S.images = S.images.filter(x=>x.id!==id); break;
    case 'img-main': { const im = S.images.find(x=>x.id===id); S.images = [im, ...S.images.filter(x=>x!==im)]; break; }
    case 'var-add': S.variants.forEach(x=>{ if (UI.newVariant.def) x.def = false; }); S.variants.push({id:nextId++, label:UI.newVariant.label, price:UI.newVariant.price, def:UI.newVariant.def}); UI.newVariant = {label:'',price:'',def:false}; break;
    case 'var-edit': UI.editVariant = id; break;
    case 'var-save': UI.editVariant = null; break;
    case 'var-def': S.variants.forEach(x => x.def = x.id===id); break;
    case 'var-del': if (!confirm('Variation wirklich löschen?')) return; S.variants = S.variants.filter(x=>x.id!==id); break;
    case 'rat-del': if (!confirm('Bewertung wirklich löschen? Sie verschwindet sofort von der Produktseite.')) return; S.ratings = S.ratings.filter(x=>x.id!==id); break;
    case 'save': e.preventDefault(); UI.dirty = false; toast('Gespeichert (Prototyp, nichts wird übertragen)'); return;
    case 'pmode': UI.previewMode = v; $('#preview').innerHTML = previewHTML(); $$('[data-act="pmode"]').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v)); return;
    case 'step': UI.step = +v; break;
    case 'step-next': UI.step = Math.min(F_STEPS.length-1, UI.step+1); break;
    case 'step-prev': UI.step = Math.max(0, UI.step-1); break;
    case 'acc': UI.open[v] = !UI.open[v]; a.parentElement.classList.toggle('open', UI.open[v]); a.setAttribute('aria-expanded', UI.open[v]); return;
    case 'acc-all': { const open = !UI.open.__all; Object.keys(UI.open).forEach(k => UI.open[k] = open); UI.open.__all = open; break; }
    case 'goto': e.preventDefault(); { const el = document.getElementById(v); const sc = $('#scroller'); sc.scrollTo({top: el.offsetTop - 8, behavior:'smooth'}); } return;
    default: return;
  }
  render();
});
/* Drag & Drop der Bilder */
document.addEventListener('dragstart', e => { const t = e.target.closest && e.target.closest('[data-img]'); if (t){ UI.drag = +t.dataset.img; e.dataTransfer.effectAllowed = 'move'; setTimeout(()=>t.classList.add('drag')); } });
document.addEventListener('dragover', e => { const t = e.target.closest && e.target.closest('[data-img]'); if (t && UI.drag !== null){ e.preventDefault(); const id = +t.dataset.img; if (UI.over !== id){ $$('.pimg.over').forEach(x=>x.classList.remove('over')); if (id!==UI.drag) t.classList.add('over'); UI.over = id; } } });
document.addEventListener('drop', e => { const t = e.target.closest && e.target.closest('[data-img]'); if (!t || UI.drag===null) return; e.preventDefault(); const to = +t.dataset.img; if (to !== UI.drag){ const a = S.images.findIndex(x=>x.id===UI.drag), b = S.images.findIndex(x=>x.id===to); const [m] = S.images.splice(a,1); S.images.splice(b,0,m); } UI.drag = UI.over = null; render(); });
document.addEventListener('dragend', () => { UI.drag = UI.over = null; $$('.pimg').forEach(x=>x.classList.remove('drag','over')); });

/* Header */
$('#menubtn').addEventListener('click', e => { e.stopPropagation(); $('#menu').classList.toggle('open'); });
$('#savebtn').addEventListener('click', () => { UI.dirty = false; toast('Gespeichert (Prototyp, nichts wird übertragen)'); });
$('#sbtrigger').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#backdrop').classList.add('open'); });
$('#backdrop').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('open'); });
/* Switcher-Tastatur: Pfeile, nicht in Eingabefeldern */
document.addEventListener('keydown', e => {
  const el = document.activeElement; if (el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) return;
  if (e.key === 'ArrowLeft'){ cycle(-1); } else if (e.key === 'ArrowRight'){ cycle(1); }
});
if (matchMedia('(prefers-color-scheme: dark)').matches && new URLSearchParams(location.search).get('theme') !== 'light') document.documentElement.classList.add('dark');
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.classList.add('dark');
render();
</script>
</body>
</html>
