name: tests

on:
  push:
    # "main" fehlt hier bewusst: dort ruft deploy.yml diesen Workflow per
  # workflow_call als Deploy-Gate auf (sonst liefe er doppelt).
    branches:
      - develop
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  # Erlaubt deploy.yml, diesen Workflow als wiederverwendbares Gate aufzurufen.
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # composer.json verlangt "php": "^8.4" -> 8.3 KANN nicht funktionieren
        # (schlug bisher immer fehl). 8.4 ist auch die Produktionsversion.
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        run: php artisan test
