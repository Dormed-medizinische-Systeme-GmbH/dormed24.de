name: tests

on:
  push:
    # "main" fehlt hier bewusst: dort ruft deploy.yml diesen Workflow per
  # workflow_call als Deploy-Gate auf (sonst liefe er doppelt).
    branches:
      - develop
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  # Erlaubt deploy.yml, diesen Workflow als wiederverwendbares Gate aufzurufen.
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # composer.json verlangt "php": "^8.4" -> 8.3 KANN nicht funktionieren
        # (schlug bisher immer fehl). 8.4 ist auch die Produktionsversion.
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      # Nach dem Build, weil die Wayfinder-Dateien dort generiert werden.
      - name: Check Frontend Types
        run: npm run types:check

      # Ebenfalls nach dem Build: die Komponenten importieren @/actions und
      # @/routes. Konfiguration in vitest.config.ts.
      - name: Frontend Tests
        run: npm run test

      # Auf Pull Requests wird die Testabdeckung gemessen und in die Job-
      # Zusammenfassung geschrieben (nur Ausgabe, noch kein Mindestwert). Als
      # Deploy-Gate auf main läuft weiter der schnelle Lauf ohne Messung.
      - name: Tests
        if: github.event_name != 'pull_request'
        run: php artisan test

      - name: Tests with coverage
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          php artisan test --coverage --no-ansi | tee coverage.txt
          {
            echo '### Testabdeckung'
            echo '```'
            tail -n 60 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
