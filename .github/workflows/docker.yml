name: docker

# Baut Dockerfile.prod und startet den kompletten Stack aus compose.yaml
# (App, Postgres, Redis). Prüft, dass die App startet, migriert und
# antwortet. Läuft nur, wenn sich am Container-Setup etwas ändert.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.prod
      - compose.yaml
      - docker/**
      - composer.lock
      - package-lock.json
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: .env für den Stack
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-$(openssl rand -hex 8)|" .env

      - name: Stack bauen und starten
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: App antwortet
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up >/dev/null; then
              echo "App erreichbar"
              exit 0
            fi
            sleep 2
          done
          echo "App nicht erreichbar" >&2
          exit 1

      - name: Datenbank und Redis aus Sicht der App
        run: |
          docker compose exec -T app php artisan migrate:status
          docker compose exec -T app php artisan tinker --execute 'Cache::put("ci", "ok", 60); echo Cache::get("ci"), PHP_EOL;' | grep -x ok

      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color

      - name: Aufräumen
        if: always()
        run: docker compose down -v
