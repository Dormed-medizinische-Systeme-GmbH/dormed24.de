name: linter

on:
  push:
    # "main" fehlt hier bewusst: dort ruft deploy.yml diesen Workflow per
    # workflow_call als Deploy-Gate auf (sonst liefe er doppelt).
    branches:
      - develop
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  # Erlaubt deploy.yml, diesen Workflow als wiederverwendbares Gate aufzurufen.
  workflow_call:

# "read" reicht: der Workflow checkt nur aus und laesst Pint/ESLint/Prettier
# laufen - er pusht nichts (der git-auto-commit-Schritt unten ist auskommentiert).
# WICHTIG: ein per `uses:` aufgerufener Workflow darf nie MEHR Rechte anfordern
# als der Aufrufer hat. deploy.yml gewaehrt "contents: read" - stuende hier
# "write", scheitert der Aufruf mit "Invalid workflow file".
# Wer den Auto-Commit-Schritt reaktiviert, muss hier UND in deploy.yml auf
# "contents: write" gehen.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: composer lint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
