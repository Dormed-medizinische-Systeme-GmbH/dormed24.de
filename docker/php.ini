; PHP-Einstellungen für das App-Image. Die PHP-Standardwerte (2 MB Upload,
; 8 MB POST) liegen unter den Grenzen der App: Produktbilder bis 5 MB,
; Newsletter bis zu 10 Bilder à 2 MB in einem Request.
upload_max_filesize = 10M
post_max_size = 32M
memory_limit = 256M
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Der Code im Image ändert sich nicht; neue Versionen kommen als neues Image.
opcache.validate_timestamps = 0
