# Nur Postgres und Redis für die lokale Entwicklung. Die App selbst läuft wie
# gewohnt auf dem Rechner (`npm run dev`) und verbindet sich über localhost.
#
#   docker compose -f compose.dev.yaml up -d
#
# Passende Werte für .env stehen in .env.example.
name: dormed24-dev

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: dormed24
            POSTGRES_USER: dormed24
            POSTGRES_PASSWORD: dormed24
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U dormed24 -d dormed24"]
            interval: 5s
            timeout: 3s
            retries: 20

    redis:
        image: redis:7-alpine
        ports:
            - "127.0.0.1:6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    postgres:
