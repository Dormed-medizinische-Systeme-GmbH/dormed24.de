# Erzwingt ausschliesslich den PHP-Provider von Nixpacks.
#
# Grund: Nixpacks/Coolify erkennt wegen des gleichzeitigen Vorhandenseins von
# composer.json UND package.json im Root faelschlich eine zweite, Node-basierte
# "static site" und generiert dafuer einen zusaetzlichen "location /"-Block in
# der nginx-Config - das kollidiert mit dem vom PHP-Provider generierten
# Laravel-Routing-Block und fuehrt zum Absturz
# ("nginx: [emerg] duplicate location "/""). Bekannter, von Coolify als
# "not planned" geschlossener Bug: https://github.com/coollabsio/coolify/issues/7867
#
# Der PHP-Provider fuehrt npm ci/npm run build fuer den Asset-Build ohnehin
# bereits selbst mit, daher aendert sich am Build-Ablauf nichts.
providers = ["php"]

# Node-Version fest auf 22 pinnen.
#
# Grund: Ohne diese Vorgabe waehlt Nixpacks fuer den PHP-Provider eigenmaechtig
# eine neuere Node-Major-Version (beobachtet: nodejs_24), unabhaengig von
# .nvmrc. Auf Hosts mit einem aelteren gepinnten Nixpacks-Build-Image
# existiert dieses Nix-Package im dort eingefrorenen nixpkgs-Snapshot noch
# nicht, was den Build sofort abbrechen laesst:
# "error: undefined variable 'nodejs_24'".
#
# nodejs_20 war KEINE gueltige Alternative: der eingefrorene Snapshot liefert
# exakt Node 20.18.1, aber Vite/rolldown (via vite.config.ts) verlangen
# ">=20.19 || >=22.12" - mit 20.18.1 bricht "npm run build" beim Laden der
# rolldown-Native-Bindings ab ("Cannot find native binding"). nodejs_22 ist in
# diesem Snapshot (Stand ~April 2025) bereits >=22.12 und damit alt genug fuer
# den Snapshot, aber neu genug fuer Vite.
[variables]
NIXPACKS_NODE_VERSION = "22"
