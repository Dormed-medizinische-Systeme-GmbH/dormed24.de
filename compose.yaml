# Produktions-Stack: App (Nginx + PHP-FPM + Queue-Worker, siehe Dockerfile.prod),
# Postgres und Redis. Zugangsdaten und App-Einstellungen kommen aus `.env`
# neben dieser Datei (Vorlage: .env.example, Abschnitt "Docker").
#
#   docker compose up -d --build
#
# Daten liegen in benannten Volumes und überleben `docker compose down`;
# erst `down -v` löscht sie.
name: dormed24

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        env_file: .env
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            REDIS_HOST: redis
            REDIS_PORT: 6379
        ports:
            # Nur lokal: TLS und Domain macht der Nginx auf dem Host (proxy_pass).
            - "127.0.0.1:${APP_PORT:-8080}:80"
        volumes:
            # Hochgeladene Produktbilder und Logs bleiben bei neuen Images erhalten.
            - storage:/app/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-dormed24}
            POSTGRES_USER: ${DB_USERNAME:-dormed24}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 20

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # AOF: Jobs in der Queue überstehen einen Neustart von Redis.
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    storage:
    postgres:
    redis:
